---
- name: Validar inventário do laboratório
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Conferir grupos das VMs
      ansible.builtin.assert:
        that:
          - groups.get('monitoring', []) | length == 1
          - groups.get('simulator', []) | length > 0
          - groups['monitoring'] | intersect(groups['simulator']) | length == 0
        fail_msg: Use o inventário gerado pelo OpenTofu com os grupos monitoring e simulator.

- name: Atualizar pacotes e instalar Docker nas VMs
  hosts: monitoring:simulator
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Aguardar acesso às VMs
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Aguardar a configuração inicial do cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Coletar informações do sistema
      ansible.builtin.setup:

  tasks:
    - name: Atualizar pacotes do sistema
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        upgrade: safe
        lock_timeout: 180

    - name: Instalar dependências do repositório Docker
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        lock_timeout: 180

    - name: Criar diretório de chaves apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Adicionar chave GPG do Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Adicionar repositório Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
        filename: docker

    - name: Instalar Docker Engine, Compose e Buildx
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin, docker-buildx-plugin]
        state: present
        lock_timeout: 180

    - name: Adicionar usuário do inventário ao grupo docker
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Habilitar e iniciar Docker
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true

- name: Implantar o simulador
  hosts: simulator
  become: true
  any_errors_fatal: true
  roles:
    - role: ../roles/simulator

- name: Configurar monitoramento
  ansible.builtin.import_playbook: monitoring.yml
  vars:
    deploy_simulator: true
