#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

users:
  - default
  - name: marcos
    gecos: DevOps lab
    groups:
      - adm
      - sudo
    shell: /bin/bash
    sudo:
      - ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_key} # vai ser substituido pelo opentofu

ssh_pwauth: false
disable_root: true